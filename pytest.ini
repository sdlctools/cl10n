[pytest]
# The suite imports the pipeline as the installed `cl10n` package — there is
# deliberately no `pythonpath` entry putting the checkout on sys.path. An
# editable install (`pip install -r requirements.txt`) is the prerequisite,
# and it is what makes these tests exercise the same import graph a `pip
# install markdown-localization` user gets rather than a source-tree-only one.
#
# `cl10n/tests/` is not packaged (see pyproject.toml's wheel `exclude`): these
# tests need this repository — the `md/` corpus, the workflow files, a
# throwaway git repo per test.
testpaths = cl10n/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q
