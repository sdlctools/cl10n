# Tests, the packaging gate, and the markdown-it-py / mdformat drift detector.
#
# Three jobs with deliberately different jobs to do:
#
# `tests` is the gate. It installs the PINNED stack from requirements.txt and
# runs the suite, including the compatibility check against the recorded
# baseline. Red here means this change breaks the pipeline.
#
# `clean-install` is the packaging gate (CLN-2 AC7). It builds the wheel and
# the sdist, then installs the wheel into a virtualenv OUTSIDE the checkout
# and exercises it from a directory that contains no source tree. That last
# part is the whole point: every module in this project used to reach its
# siblings and its data files through `sys.path` mutation and paths relative
# to `__file__`, which works perfectly in a checkout and silently does not in
# `site-packages`. A test run inside the repo cannot tell the two apart —
# this job can, and it is the check that would have caught every one of those
# regressions.
#
# `compat-latest` is the early warning. It installs the newest releases of the
# six packages the hashing contract depends on, ignoring the pins, and runs
# only the drift detector. Red here means *an upgrade you have not taken yet*
# would break the pipeline — which is exactly when you want to find out, rather
# than on the afternoon someone bumps a pin. It is `continue-on-error` because
# a third party publishing a release is not this repository being broken; it
# reports through the job summary instead of failing the run.
#
# The schedule is what makes the second job worth having: drift arrives when an
# upstream maintainer ships, not when we push.

name: checks

on:
  push:
    branches: [development]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC — a week's worth of upstream releases at a time.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the pinned stack
        run: |
          python -m venv venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Compatibility baseline
        # Ahead of the suite: when the parser contract has moved, every other
        # failure is downstream noise and this one line is the diagnosis.
        run: venv/bin/python3 -m cl10n.compat_check

      - name: Tests
        run: venv/bin/python3 -m pytest -q

  clean-install:
    # Does the WHEEL work, outside a checkout? See the header.
    name: build the distribution and run it from an installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build
          twine check dist/*

      - name: Install the wheel into a fresh virtualenv outside the checkout
        # `/tmp/clean` deliberately contains nothing but the virtualenv: with
        # the checkout on the path, `import cl10n` would find the source tree
        # and this whole job would prove nothing.
        run: |
          mkdir -p /tmp/clean
          python -m venv /tmp/clean/.venv
          /tmp/clean/.venv/bin/pip install --quiet "$(echo dist/*.whl)[groq]"

      - name: Exercise the console script and the package data
        # An absolute path: `working-directory` is not shell-expanded, so a
        # `~` here would be taken literally.
        working-directory: /tmp/clean
        run: |
          set -euo pipefail
          # 1. The entry point exists and exposes the four subcommands.
          #    Captured once rather than re-piped per subcommand: `grep -q`
          #    closes the pipe on its first match, and under `pipefail` the
          #    SIGPIPE'd writer would fail the whole pipeline.
          help_text=$(.venv/bin/cl10n --help)
          printf '%s\n' "$help_text"
          for sub in plan run render status; do
            case "$help_text" in
              *"$sub"*) ;;
              *) echo "::error::subcommand $sub missing from the console script"; exit 1 ;;
            esac
          done

          # 2. Package data resolves through importlib.resources — the
          #    provider registry (providers.toml), the JSON Schemas, and the
          #    connector import that the `groq` name collision used to break.
          .venv/bin/python3 - <<'PY'
          import json
          from cl10n import resources
          from cl10n.providers import build_translator, load_registry

          registry = load_registry()
          assert registry.default == "groq", registry.default
          assert set(registry.names()) == {"groq", "mistral", "nvidia", "anthropic_api", "anthropic_oauth"}, registry.names()

          translator = build_translator(registry.get("groq"), "x/y")
          assert type(translator).__module__ == "cl10n.providers.groq"

          for name in ("queue", "manifest", "translation-memory"):
              json.load(open(resources.schema_path(name), encoding="utf-8"))
          print("package data OK")
          PY

          # 3. The drift detector runs from the installed package: it reads
          #    both its baseline and its fixture out of the wheel.
          .venv/bin/python3 -m cl10n.compat_check

  compat-latest:
    # Early warning against releases nobody has adopted yet. Never blocks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the latest parsing stack, ignoring the pins
        id: install
        run: |
          python -m venv venv
          # `--no-deps` is what makes "ignoring the pins" true: a normal
          # install would resolve pyproject.toml's exact pins and the upgrade
          # below would have nothing to do.
          venv/bin/pip install --quiet --no-deps .
          venv/bin/pip install --quiet --upgrade \
            markdown-it-py mdit-py-plugins mdformat mdformat-gfm \
            mdformat-frontmatter linkify-it-py
          venv/bin/pip list --format=freeze \
            | grep -iE '^(markdown-it-py|mdit-py-plugins|mdformat|mdformat-gfm|mdformat[-_]frontmatter|linkify-it-py)=' \
            > /tmp/latest.txt || true
          cat /tmp/latest.txt

      - name: Drift detector against the latest releases
        id: drift
        run: |
          if venv/bin/python3 -m cl10n.compat_check > /tmp/compat.txt 2>&1; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=drift" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/compat.txt

      - name: Summarise
        if: always()
        run: |
          {
            if [ "${{ steps.drift.outputs.status }}" = "clean" ]; then
              echo "## Upstream compatibility: clean"
              echo "The newest releases agree with the recorded baseline — the pins in"
              echo "\`pyproject.toml\` can be moved forward when convenient."
            else
              echo "## Upstream compatibility: DRIFT"
              echo "The newest releases disagree with the recorded baseline. The pins in"
              echo "\`pyproject.toml\` are protecting the pipeline right now — do not"
              echo "move them until the findings below are resolved."
            fi
            echo
            echo '### Versions tested'
            echo '```'; cat /tmp/latest.txt 2>/dev/null || echo '(unavailable)'; echo '```'
            echo '### Detector output'
            echo '```'; cat /tmp/compat.txt 2>/dev/null || echo '(unavailable)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
